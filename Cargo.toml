[workspace]
resolver = "3"
members = [
    "crates/core/ir",
    "crates/core/engine",
    "crates/core/executor",
    "crates/core/executor-sandbox",
    "crates/core/steps",
    "crates/core/driver",
    "crates/core/execution",
    "crates/core/frontend",
    "crates/core/frontend-native",
    "crates/core/runtime",
    "crates/core/cli",
    "crates/core/testkit",
    "crates/github/frontend",
    "crates/github/actions",
    "crates/github/objects",
    "crates/github/acceptance",
    "crates/fabro/frontend",
    "crates/fabro/steps",
    "crates/fabro/acceptance",
    "crates/petri/lib",
    "crates/petri/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
allow_attributes_without_reason = "warn"

implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"

print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
disallowed_methods = "deny"
exit = "warn"
get_unwrap = "warn"
unwrap_used = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
use_self = "warn"
wildcard_imports = "warn"
absolute_paths = "warn"

[workspace.dependencies]
# Native agent runtime, pinned with the prompt-report and session-scope APIs.
pebble-coding-agent = { git = "https://github.com/lithoscomputer/pebble.git", rev = "69969420c9017ca15ac6c175c820a0cb8090866a" }
# The tool middleware trait Petri implements for Fabro tool hooks; the coding agent does not re-export it.
pebble-agent = { git = "https://github.com/lithoscomputer/pebble.git", rev = "69969420c9017ca15ac6c175c820a0cb8090866a" }
lithos-llm = { git = "https://github.com/lithoscomputer/lithos-llm", rev = "a1e3fd37b7153870411701327ac117606753fe90", default-features = false }
globset = "0.4"
ir = { package = "petri-ir", path = "crates/core/ir" }
engine = { package = "petri-engine", path = "crates/core/engine" }
executor = { package = "petri-executor", path = "crates/core/executor" }
executor-sandbox = { package = "petri-executor-sandbox", path = "crates/core/executor-sandbox" }
# sandbox-driver lives in the `lithoscomputer/sandbox-driver` repo, pinned by
# revision. To develop the two together, point these at the sibling checkout
# with a `[patch]` section in a local, untracked Cargo config, and move the pin
# forward once the matching sandbox-driver commit is pushed.
sandbox-driver = { git = "https://github.com/lithoscomputer/sandbox-driver.git", rev = "ddb32e19e763299319ecf6aebc8961298db80c0c" }
sandbox-driver-protocol = { git = "https://github.com/lithoscomputer/sandbox-driver.git", rev = "ddb32e19e763299319ecf6aebc8961298db80c0c" }
sandbox-driver-docker-config = { git = "https://github.com/lithoscomputer/sandbox-driver.git", rev = "ddb32e19e763299319ecf6aebc8961298db80c0c" }
sandbox-driver-daytona-config = { git = "https://github.com/lithoscomputer/sandbox-driver.git", rev = "ddb32e19e763299319ecf6aebc8961298db80c0c" }
steps = { package = "petri-steps", path = "crates/core/steps" }
driver = { package = "petri-driver", path = "crates/core/driver" }
execution = { package = "petri-execution", path = "crates/core/execution" }
frontend = { package = "petri-frontend", path = "crates/core/frontend" }
frontend-gha = { package = "petri-frontend-gha", path = "crates/github/frontend" }
github-actions = { package = "petri-github-actions", path = "crates/github/actions" }
github-objects = { package = "petri-github-objects", path = "crates/github/objects" }
frontend-native = { package = "petri-frontend-native", path = "crates/core/frontend-native" }
frontend-fabro = { package = "petri-frontend-fabro", path = "crates/fabro/frontend" }
fabro-steps = { package = "petri-fabro-steps", path = "crates/fabro/steps" }
runtime = { package = "petri-runtime", path = "crates/core/runtime" }
cli = { package = "petri-cli-core", path = "crates/core/cli" }
petri = { path = "crates/petri/lib" }
testkit = { package = "petri-testkit", path = "crates/core/testkit" }
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
marked-yaml = "0.8"
# The event parser under `marked-yaml`, used directly by the anchor-resolving
# loader in `petri-frontend`; keep the version in step with `marked-yaml`'s.
yaml-rust2 = "0.10"
proptest = "1.11"
# The Fabro frontend renders `{{ inputs.* }}` with the template language Fabro
# itself uses, so filters and semantics match. Pinned exactly, as Fabro pins it.
minijinja = "=2.19.0"
# `workflow.toml` beside a Fabro workflow carries its input defaults.
toml = "0.9"
# The Fabro agent step validates `output_schema` JSON Schemas as Fabro does.
jsonschema = { version = "0.42", default-features = false }
# `acp.command` is a shell-quoted command line; split it the way Fabro does.
shlex = "1"
libc = "0.2"
tokio-util = "0.7"
# Full `regex`, not `regex-lite`: the `matches` builtin must accept every pattern
# the frontends it serves validate at parse time, so this is a language-compatibility
# decision, not a binary-size one.
regex = "1"
# HTTP hooks post the event context from the host; the same client stack `lithos-llm` already links.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "sync",
    "time",
    "io-util",
    "fs",
] }
serde = { version = "1", features = ["derive", "rc"] }
# The ObjectService's HTTP stack (per review decision: the listener rides hyper).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Signed blob URLs are HMAC query tokens; the run token carries real randomness.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
humantime = "2"
# The local-checkout step materializes the workspace as one tarball: mode bits
# and symlinks survive, and the environment extracts it with its own `tar`.
tar = "0.4"
# `preserve_order`: GHA matrix axes, object filters and outputs follow document
# order, and a sorted map would silently reorder them.
# `float_roundtrip`: a float parsed back from the event log is the float that
# was written, so a replayed stream equals the live one (backend payloads
# carry floats such as usage percentages).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
# Operator-facing diagnostics. Emitted by internal crates; the subscriber is
# installed by the `petri` binary alone.
tracing = "0.1"
# `env-filter` is not a default feature. Only `petri-cli` may depend on this.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
