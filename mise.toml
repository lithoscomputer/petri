min_version = "2026.6.11"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
minimum_release_age = "24h"

[tools]
"cargo:cargo-nextest" = { version = "0.9.140", locked = true }
rust = [
  { version = "1.97.1", profile = "minimal", components = ["clippy"] },
  { version = "1.89.0", profile = "minimal" },
  { version = "nightly-2026-04-14", profile = "minimal", components = ["rustfmt"] },
]
zizmor = "1.29.0"

[tasks.setup]
description = "Prepare the pinned Rust style guide"
run = "bin/style-guides prepare"

[tasks.dev]
description = "Build and run the Petri CLI"
depends = ["plugins:build"]
env = { PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = "cargo run --locked -p petri-cli --"

[tasks."plugins:build"]
description = "Install the sandbox-driver plugins the tests launch, at the commit Cargo.lock locks"
run = "scripts/plugins-build.sh"

[tasks."plugins:build:daytona"]
description = "Install the Daytona plugin beside the host and Docker ones, for the live Daytona tier"
env = { SANDBOX_DRIVER_PLUGINS = "host docker daytona" }
run = "scripts/plugins-build.sh"

[tasks.fmt]
description = "Format Rust with the pinned nightly formatter"
run = "cargo +nightly-2026-04-14 fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting without changing files"
run = "cargo +nightly-2026-04-14 fmt --check --all"

[tasks.lint]
description = "Lint all Rust targets with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/clippy" }
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all Rust tests with Nextest and Cargo doctests"
depends = ["plugins:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = [
  "cargo nextest run --locked --workspace --all-targets --all-features --no-tests=pass",
  "cargo test --locked --workspace --all-features --doc",
]

[tasks."test:fabro:blackbox"]
description = "Run the required Fabro black box scenarios on the shipped petri binary and write their evidence records and coverage report"
depends = ["plugins:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = "scripts/test-fabro-blackbox.sh"

[tasks."test:fabro:blackbox:repeat"]
description = "Repeat the Fabro black box scenarios in fresh processes under three test schedules (the nightly gate)"
depends = ["plugins:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_BLACKBOX_REPEAT = "3", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = "scripts/test-fabro-blackbox.sh"

[tasks."test:fabro:blackbox:strict"]
description = "The black box scenarios with every gated resource required: Docker, the vendored bundles, and no skipped matrix cell. Runs the differential matrix first into the same evidence directory, since its cells are required cells of matrix.json and the strict report counts a cell without a result as missing"
depends = ["plugins:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_REQUIRE_DOCKER = "1", PETRI_REQUIRE_FABRO_BUNDLES = "1", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = 'export PETRI_EVIDENCE_RUN="${PETRI_EVIDENCE_RUN:-$(date -u +%Y%m%dT%H%M%SZ)-$$}" && scripts/test-fabro-differential.sh && scripts/test-fabro-blackbox.sh'

[tasks."check:fabro:readiness"]
description = "The final readiness gate: the strict black box run (the differential matrix first, then every scenario with Docker and the vendored bundles required), and a coverage report that fails unless every required cell of matrix.json passed, blocked cells included. Routine CI keeps --strict, which tolerates a blocked cell"
depends = ["plugins:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_REQUIRE_DOCKER = "1", PETRI_REQUIRE_FABRO_BUNDLES = "1", PETRI_COVERAGE_READINESS = "1", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = 'export PETRI_EVIDENCE_RUN="${PETRI_EVIDENCE_RUN:-$(date -u +%Y%m%dT%H%M%SZ)-$$}" && scripts/test-fabro-differential.sh && scripts/test-fabro-blackbox.sh'

[tasks."test:fabro:differential"]
description = "Run the differential matrix: the reference-version check, then every scenario through the shipped petri binary and the pinned fabro binary (built by scripts/fabro-provision.sh once; a missing binary compares Petri against the committed references)"
depends = ["plugins:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = "scripts/test-fabro-differential.sh"

[tasks."test:daytona"]
description = "Run the live Daytona tier against the account DAYTONA_API_KEY names: every Daytona test is required, so a missing credential or plugin fails instead of skipping. Creates billable sandboxes"
depends = ["plugins:build:daytona"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_REQUIRE_DAYTONA = "1", PETRI_SANDBOX_DAYTONA_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-daytona", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = "cargo nextest run --locked --workspace --all-targets --all-features --no-tests=fail --no-fail-fast -E 'binary(daytona_backend) | binary(daytona) | test(/daytona/)'"

[tasks."test:release"]
description = "Run all Rust tests in release mode"
depends = ["plugins:build"]
env = { PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host", PETRI_SANDBOX_PLUGIN_DEV = "1" }
run = "cargo nextest run --locked --release --workspace --all-targets --all-features --no-tests=pass"

[tasks."test:remote"]
description = "Transfer artifacts through an isolated Docker daemon with no host filesystem mounts"
depends = ["plugins:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = "scripts/test-remote-docker.sh"

[tasks."lean:build"]
description = "Build the Lean model of the engine core and check its proofs (needs elan)"
dir = "{{config_root}}/lean"
run = "lake build"

[tasks."test:lean"]
description = "Check the engine core against the Lean model, with the model required"
depends = ["lean:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_REQUIRE_LEAN_MODEL = "1" }
run = "cargo nextest run --locked -p petri-engine --test lean_model --no-tests=fail"

[tasks."build:release"]
description = "Build the workspace in release mode"
run = "cargo build --locked --workspace --release"

[tasks."check:msrv"]
description = "Check all targets with the declared minimum Rust version"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/msrv" }
run = "cargo +1.89.0 check --locked --workspace --all-targets --all-features"

[tasks."check:actions"]
description = "Audit GitHub Actions workflows"
run = "zizmor .github/workflows"

[tasks."check:bundles"]
description = "Verify the vendored Fabro bundles against bundles.lock.json, digest by digest"
run = "scripts/corpus-fetch-fabro-bundles.sh"

[tasks."check:pins"]
description = "Check internal git dependency refs, and that Cargo.lock, CONTRACT.md, and the latest evidence records agree"
run = "python3 scripts/check-pins.py"

[tasks."check:whitespace"]
description = "Check tracked and untracked patches for whitespace errors"
run = ["git diff --check", "git diff --cached --check"]

[tasks."check:release-build"]
description = "Build release artifacts after the test suite completes"
depends = ["test"]
run = "mise run build:release"

[tasks.check]
description = "Run the complete routine verification gate"
depends = [
  "fmt:check",
  "lint",
  "check:release-build",
  "check:actions",
  "check:bundles",
  "check:pins",
  "check:whitespace",
  "test:remote",
]

[tasks."test:long"]
description = "Run the long tests the routine gate ignores: the 10,000-invocation admission ceiling"
depends = ["plugins:build"]
env = { CARGO_PROFILE_TEST_DEBUG = "0", PETRI_SANDBOX_DOCKER_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-docker", PETRI_SANDBOX_HOST_PLUGIN = "{{config_root}}/target/plugins/bin/sandbox-driver-host" }
run = "cargo nextest run --locked -p petri-execution --test admission --run-ignored ignored-only --no-tests=fail"

[tasks."check:nightly"]
description = "Run the extended nightly verification gate"
depends = ["check"]
run = [
  "mise run check:msrv",
  "mise run test:long",
  "mise run test:fabro:blackbox:repeat",
  "mise run test:fabro:differential",
  "cargo clean --profile dev",
  "cargo clean --profile test",
  "cargo clean --target-dir target/clippy",
  "cargo clean --target-dir target/msrv",
  "mise run test:release",
]

[tasks.release]
description = "Build and package a Petri release for the current platform"
run = "bin/build-release"
