# These tests share external resources: the corpus action cache and the Docker
# daemon, including its container networks. Run them one at a time.
[test-groups.external]
max-threads = 1

[[profile.default.overrides]]
filter = "package(petri-github-acceptance) | (package(petri-driver) & binary(docker)) | (package(petri-runtime) & (binary(local_executor) | binary(services)))"
test-group = "external"

# Catch a blocked runtime or teardown even when an async timeout cannot run.
# The Fabro black box cells that run in a container each start one: under
# the full gate, with the release build and the remote Docker test beside
# them, an unbounded set starves itself past the cells' deadlines. Bound how
# many run at once; the host cells stay unbounded.
[test-groups.fabro-docker]
max-threads = 4

[[profile.default.overrides]]
filter = "package(petri-cli) & test(/docker/)"
test-group = "fabro-docker"

[[profile.default.overrides]]
filter = "package(petri-execution) & test(an_execution_restart_keeps_the_container_identity_and_workspace)"
slow-timeout = { period = "60s", terminate-after = 3 }

# The live Daytona tier (`mise run test:daytona`): every cell creates a sandbox on
# the account, and the first one may build the shared runner snapshot. A few
# at a time keeps the account's concurrency in bounds; the slow notice is
# raised so a sandbox that takes minutes to come up is not reported as stuck.
# Fork patch (2026-09-28, fabro-6558 session): a global slow bound so any
# test waiting on an absent external resource (docker socket, gate, port)
# terminates instead of wedging the whole suite forever. Generous period,
# hard stop after two.
[[profile.default.overrides]]
filter = "all()"
slow-timeout = { period = "180s", terminate-after = 2 }

[test-groups.daytona]
max-threads = 3

[[profile.default.overrides]]
filter = "binary(daytona_backend) | binary(daytona) | test(/daytona/)"
test-group = "daytona"
slow-timeout = { period = "300s" }

# The profile the Fabro evidence entry points and CI use: the same run with a
# JUnit report the coverage report reads (scripts/fabro-coverage-report.py).
[profile.ci]

[profile.ci.junit]
path = "junit.xml"
