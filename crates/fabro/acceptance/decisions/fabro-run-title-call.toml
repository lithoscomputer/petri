id = "fabro-run-title-call"
title = "Fabro asks a small model for a run title before the first stage"
scenarios = ["*"]
bundles = ["*"]
fabro = "Before the first stage the server sends one request on a provider's small default model (gpt-5.4-mini on OpenAI, claude-haiku-4-5-20251001 on Anthropic) whose prompt opens with `Generate a concise, human-readable title for this Fabro workflow run`. Its failure does not affect the run."
petri = "No such call: the standalone runner has no run title."
user_visible_effect = "One more provider request per run on Fabro, outside any stage, on a model the workflow never named."
reason = "A platform feature of the Fabro server, not workflow semantics; readiness item 1 does not require identical platform behaviour."
acceptance = "The projection classifies exactly that prompt as a platform request (`compare::platform_request`), lists it under `platform_requests` apart from the workflow's requests, and counts it under `counts.platform_requests`; only that count may differ. The workflow's own request sequence is compared exactly."

[[accepts]]
kind = "count"
