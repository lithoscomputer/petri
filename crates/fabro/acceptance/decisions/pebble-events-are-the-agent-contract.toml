id = "pebble-events-are-the-agent-contract"
title = "Pebble's event stream is the contract for every agent fact"
scenarios = ["*"]
bundles = ["*"]
fabro = "Since `05ebd0f` Fabro stores Pebble's `CodingAgentEvent`s verbatim under `agent.*` names (`agent.route.failover`, `agent.route.failover.stopped`, `agent.mcp.server.ready`, `agent.mcp.server.failed`, `agent.mcp.server.disconnected`, `agent.tool.started`, `agent.tool.completed`, ...) and folds them with Pebble's `SessionProjection`; its former mirrors (`agent.failover`, `agent.mcp.ready`, `agent.mcp.failed`, `agent.mcp.disconnected`) are gone, and only a prompt stage's `prompt.failover` is Fabro's own. The reference before it (`b648291`) folded Pebble's events into that mirror vocabulary and kept both."
petri = "Pebble's `CodingAgentEvent` stream, recorded durably as `agent_activity` (the `pebble` envelope: `seq`, `stream_id`, `session_id`, `parent_session_id`, `tool_call_id`, `event`), is the event contract for everything Pebble knows about a native agent node: routes and failover (`SessionStarted`, `RouteFailover`, `RouteFailoverStopped`, `AssistantMessage`), MCP servers and their calls (`McpServerReady`, `McpServerFailed`, `McpServerDisconnected`, `ToolCallStarted`/`ToolCallCompleted` under `mcp__<server>__<tool>`), tools, usage, compaction, sub-agents. Petri emits a `StepEvent::Custom` only for a fact Pebble cannot know, and never restates a Pebble event. Removed 2026-09-12: `fabro.fallback.route`, `fabro.fallback.usage`, `fabro.fallback.failover`, `fabro.fallback.stop`, `attempt_finished.metrics.custom.fallback.*`, `fabro.mcp.server` (`starting`, `ready`, `failed`, `disconnected`, `stopped`) and `fabro.mcp.tool`. Kept, one per area: `fabro.fallback.plan` (the routes and the configuration notices Petri planned) and `fabro.mcp.unavailable` (a server Petri never named to Pebble because a secret its entry needs is unavailable). Two Pebble facts also go to the node's stderr for the terminal, as log lines and not events: a fallback move (`model fallback: <from> failed (<kind>); continuing on <to> (attempt <n> of the plan)`) and a server that did not start (`mcp server <name> failed to start: <reason>`, the name in backticks)."
user_visible_effect = "A consumer of Petri's event log reads route and MCP facts from the `agent_activity` envelope instead of Petri's own kinds; the event log carries each fact once. A prompt node (`tab`), which runs no Pebble session, reports its plan and its `fabro.prompt.completed` totals, and its own fallback move on stderr only. A plan with no usable target names no fallback route to Pebble, so no stop event is published for it: the stage fails with the primary's error and nothing describes the missing routes beyond the plan's `model_fallback_chain_empty` notice."
reason = "Two records of one fact cost a mirror in Petri that reshaped every Pebble event into a Petri kind and drifted from it (position and usage arithmetic, stop reasons re-derived, a session id copied). The maintainer chose simplicity: the repositories are greenfield, so the old kinds were removed rather than kept beside Pebble's events."
acceptance = "Events are not compared by the differential matrix (`event-kinds`); projections are. The fallback, MCP, readiness and embedding suites read Pebble's variants (`crates/petri/cli/tests/support/fabro/failures.rs::pebble_events`, the `pebble:<Variant>` kinds of the readiness projections). Retire this record only if Petri grows a custom kind that restates a Pebble event, which this record forbids."
