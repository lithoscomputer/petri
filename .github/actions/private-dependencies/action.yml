name: Read private bundle sources
description: Configure read-only deploy keys for the private Fabro black box bundle sources
inputs:
  code-review-key:
    description: Read-only deploy key for lithoscomputer/code-review, a Fabro black box bundle source
    required: false
    default: ""
  factory-key:
    description: Read-only deploy key for veniceai/factory, a Fabro black box bundle source
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Configure bundle source access
      shell: bash
      env:
        CODE_REVIEW_DEPLOY_KEY: ${{ inputs.code-review-key }}
        FACTORY_DEPLOY_KEY: ${{ inputs.factory-key }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/setup.sh"
